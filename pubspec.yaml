name: finanse
description: "Aplicativo de controle financeiro pessoal"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: 0.20.2
  sqflite: ^2.3.0
  path: ^1.9.0
  fl_chart: ^1.2.0
  uuid: ^4.3.3
  shared_preferences: ^2.5.5
  csv: ^8.0.0

  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.0
  flutter_timezone: ^5.1.0

  pdf: 3.12.0
  excel: ^4.0.6
  path_provider: ^2.1.6
  share_plus: ^12.0.2
  file_selector: 1.1.0
  image_picker: ^1.2.3
  flutter_secure_storage: ^10.3.1
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2
  flutter_launcher_icons: ^0.14.4
dependency_overrides:
  jni: 1.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/finanse_icon.png
    - assets/splash/finanse_splash.png